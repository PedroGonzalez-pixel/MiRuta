<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>MiRuta Pro v5</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- favicon vide pour éviter l'erreur 404 -->
  data:,

  <!-- Leaflet correctement chargé -->
  https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
  https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
    }

    .sidebar {
      width: 320px;
      height: 100vh;
      float: left;
      padding: 15px;
      background: white;
      border-right: 1px solid #ddd;
      box-sizing: border-box;
      overflow-y: auto;
    }

    #map {
      margin-left: 320px;
      height: 100vh;
    }

    input, button, select {
      width: 100%;
      margin-bottom: 8px;
      padding: 10px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }

    button:hover {
      background: #0062cc;
    }

    .card {
      padding: 12px;
      background: #fafafa;
      border: 1px solid #ddd;
      margin-top: 12px;
      border-radius: 10px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
    }

    #info {
      margin-top: 12px;
      font-size: 13px;
      color: #333;
      line-height: 1.5;
      min-height: 20px;
    }

    .results {
      list-style: none;
      padding: 0;
      margin: 0;
      margin-top: 10px;
      max-height: 320px;
      overflow-y: auto;
    }

    .results li {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .results li:hover {
      background: #f0f6ff;
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 100%;
        height: auto;
        float: none;
        border-right: none;
        border-bottom: 1px solid #ddd;
      }

      #map {
        margin-left: 0;
        height: 60vh;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>MiRuta Pro</h2>

    <input id="start" value="Paris" placeholder="Départ" />
    <input id="end" value="Barcelone" placeholder="Arrivée" />

    <button id="btnRoute">Tracer l’itinéraire</button>
    <button id="btnStops">Trouver les stations</button>
    <button id="btnClear">Effacer</button>

    <div class="card">
      <strong>Résumé de l’itinéraire</strong>
      <div class="stat">Distance <span id="distance">-</span></div>
      <div class="stat">Temps <span id="duration">-</span></div>
      <div class="stat">Stations trouvées <span id="stationsCount">0</span></div>
    </div>

    <div id="info">Prêt</div>

    <ul id="results" class="results"></ul>
  </div>

  <div id="map"></div>

  <script>
    // =========================
    // CONFIG
    // =========================
    const API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZhMmQ3MGMxMDcxZTQ2MDk4MDNkOGQyYTE2ZGZhYTcyIiwiaCI6Im11cm11cjY0In0=";

    const OVERPASS_ENDPOINTS = [
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass-api.de/api/interpreter"
    ];

    // =========================
    // MAP
    // =========================
    const map = L.map("map").setView([48.85, 2.35], 6);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // =========================
    // STATE
    // =========================
    let routeCoords = [];
    let routeLayer = null;
    let stationMarkers = [];

    // =========================
    // HELPERS
    // =========================
    function setInfo(msg) {
      document.getElementById("info").innerHTML = msg;
    }

    function formatDistance(meters) {
      return (meters / 1000).toFixed(1) + " km";
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.round((seconds % 3600) / 60);
      return h + "h " + m + "m";
    }

    async function geocode(place) {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`
      );
      const data = await res.json();

      if (!data.length) {
        throw new Error("Ville introuvable : " + place);
      }

      return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
    }

    function clearStations() {
      stationMarkers.forEach(marker => map.removeLayer(marker));
      stationMarkers = [];
      document.getElementById("results").innerHTML = "";
      document.getElementById("stationsCount").textContent = "0";
    }

    function distanceToRoute(point) {
      let min = Infinity;

      for (const r of routeCoords) {
        const d = Math.sqrt(
          Math.pow(point[0] - r[0], 2) + Math.pow(point[1] - r[1], 2)
        );
        if (d < min) min = d;
      }

      return min;
    }

    // =========================
    // ROUTE
    // =========================
    async function route() {
      try {
        setInfo("Calcul de l’itinéraire en cours...");
        clearStations();

        const start = await geocode(document.getElementById("start").value);
        const end = await geocode(document.getElementById("end").value);

        const res = await fetch(
          "https://api.openrouteservice.org/v2/directions/driving-car/geojson",
          {
            method: "POST",
            headers: {
              "Authorization": API_KEY,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              coordinates: [
                [start[1], start[0]],
                [end[1], end[0]]
              ]
            })
          }
        );

        const data = await res.json();

        if (!data.features || !data.features.length) {
          throw new Error("Aucun itinéraire trouvé.");
        }

        routeCoords = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);

        if (routeLayer) {
          map.removeLayer(routeLayer);
        }

        routeLayer = L.polyline(routeCoords, { color: "blue", weight: 5 }).addTo(map);
        map.fitBounds(routeLayer.getBounds());

        const summary = data.features[0].properties.summary;

        document.getElementById("distance").textContent = formatDistance(summary.distance);
        document.getElementById("duration").textContent = formatTime(summary.duration);

        setInfo("✅ Itinéraire calculé");
      } catch (e) {
        console.error(e);
        setInfo("❌ Erreur itinéraire : " + e.message);
      }
    }

    // =========================
    // STATIONS
    // =========================
    async function findStops() {
      try {
        clearStations();

        if (!routeCoords.length) {
          setInfo("⚠️ Trace d’abord un itinéraire");
          return;
        }

        setInfo("Recherche des stations...");

        const points = routeCoords.filter((_, i) => i % 80 === 0);

        let data = null;

        for (const endpoint of OVERPASS_ENDPOINTS) {
          try {
            const query = `
[out:json][timeout:10];
(
  ${points.map(p => `node(around:1000,${p[0]},${p[1]})["amenity"="fuel"];`).join("")}
);
out;
            `.trim();

            const res = await fetch(endpoint, {
              method: "POST",
              body: query
            });

            data = await res.json();

            if (data && data.elements) {
              break;
            }
          } catch (err) {
            console.log("Overpass fallback:", endpoint, err);
          }
        }

        if (!data || !data.elements || data.elements.length === 0) {
          setInfo("⚠️ Aucune station trouvée ou service indisponible");
          return;
        }

        const list = [];

        data.elements.forEach(e => {
          if (!e.lat || !e.lon) return;
          const d = distanceToRoute([e.lat, e.lon]);
          list.push({ e, d });
        });

        list.sort((a, b) => a.d - b.d);

        const results = document.getElementById("results");
        const selected = list.slice(0, 8);

        selected.forEach(item => {
          const marker = L.marker([item.e.lat, item.e.lon])
            .addTo(map)
            .bindPopup("⛽ " + (item.e.tags?.name || "Station-service"));

          stationMarkers.push(marker);

          const li = document.createElement("li");
          li.innerHTML = `
            <strong>${item.e.tags?.name || "Station-service"}</strong><br>
            Proximité de la route : ${item.d.toFixed(4)}
          `;
          li.addEventListener("click", () => {
            map.setView([item.e.lat, item.e.lon], 15);
            marker.openPopup();
          });

          results.appendChild(li);
        });

        document.getElementById("stationsCount").textContent = selected.length;

        if (stationMarkers.length > 0) {
          const group = L.featureGroup(stationMarkers);
          map.fitBounds(group.getBounds().pad(0.2));
        }

        setInfo("✅ Stations affichées");
      } catch (e) {
        console.error(e);
        setInfo("❌ Erreur stations : " + e.message);
      }
    }

    // =========================
    // CLEAR
    // =========================
    function clearAll() {
      clearStations();

      if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
      }

      routeCoords = [];
      document.getElementById("distance").textContent = "-";
      document.getElementById("duration").textContent = "-";
      setInfo("Prêt");
    }

    // =========================
    // EVENTS
    // =========================
    document.getElementById("btnRoute").addEventListener("click", route);
    document.getElementById("btnStops").addEventListener("click", findStops);
    document.getElementById("btnClear").addEventListener("click", clearAll);
  </script>
</body>
</html>
