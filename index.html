<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>MiRuta v1.5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d0f14;--bg2:#13161d;--surface:#1f2330;--surface2:#252a38;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f0ee;--text2:#9ba3b8;--text3:#5a6278;
  --accent:#e8c97a;--accent2:#c9a843;
  --blue:#4a9eff;--red:#ff6b6b;--green:#5dc98a;--teal:#3dcbb8;
  --r:12px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:380px;min-width:380px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

/* ── TOP BAR (logo + collapse) ── */
.topbar{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-icon svg{width:17px;height:17px;fill:var(--bg);}
.logo-text{flex:1;}
.logo-text h1{font-family:'DM Serif Display',serif;font-size:18px;line-height:1;}
.logo-text span{font-size:10px;color:var(--text3);}
.version-badge{font-size:9px;font-weight:700;background:rgba(232,201,122,0.15);color:var(--accent);padding:2px 7px;border-radius:20px;letter-spacing:0.5px;}
.collapse-btn{background:none;border:1px solid var(--border2);border-radius:8px;cursor:pointer;padding:5px 8px;color:var(--text3);display:flex;align-items:center;gap:4px;font-size:10px;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.2s;flex-shrink:0;}
.collapse-btn:hover{color:var(--accent);border-color:var(--accent);}
.collapse-btn svg{width:12px;height:12px;transition:transform 0.3s;}
.collapse-btn.open svg{transform:rotate(180deg);}

/* ── COLLAPSIBLE PANEL ── */
.panel{overflow:hidden;transition:max-height 0.38s cubic-bezier(0.4,0,0.2,1);max-height:500px;flex-shrink:0;}
.panel.closed{max-height:0;}

/* ── FORM ── */
.form-section{padding:14px 16px;border-bottom:1px solid var(--border);}
.field-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:var(--text3);margin-bottom:5px;display:block;}
.iw{position:relative;margin-bottom:8px;}
.iw:last-of-type{margin-bottom:0;}
.ii{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
input[type=text],input[type=time],select{
  width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);
  color:var(--text);padding:10px 10px 10px 33px;font-size:13px;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color 0.2s;
}
input[type=time],select{padding-left:10px;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:var(--text3);}
select option{background:var(--surface2);}
.vline{height:8px;margin:0 0 8px 16px;width:1px;background:var(--border2);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stack{display:flex;flex-direction:column;gap:5px;}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:12px;color:var(--text2);}
.checkbox-row input{width:auto;padding:0;accent-color:var(--accent);}

/* ── FILTER SECTION ── */
.filter-section{padding:10px 16px 12px;border-bottom:1px solid var(--border);}
.filter-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:all 0.15s;display:flex;align-items:center;gap:5px;user-select:none;}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.chip svg{width:11px;height:11px;}
.btn-reset{background:none;border:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--text3);font-family:'DM Sans',sans-serif;letter-spacing:0.5px;padding:3px 7px;border-radius:6px;text-transform:uppercase;transition:color 0.15s;border:1px solid var(--border);}
.btn-reset:hover{color:var(--accent);border-color:var(--accent);}

/* ── BUTTONS ── */
.btn-section{padding:12px 16px;border-bottom:1px solid var(--border);}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.btn{border:none;cursor:pointer;border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.18s;width:100%;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-go{background:var(--accent);color:#0d0f14;grid-column:1/-1;}
.btn-go:hover{background:var(--accent2);}
.btn-stops{background:var(--surface);color:var(--text);border:1px solid var(--border2);}
.btn-stops:hover:not(:disabled){background:var(--surface2);}
.btn-clear{background:transparent;color:var(--text3);border:1px solid var(--border);}
.btn-clear:hover{color:var(--red);border-color:var(--red);}
.btn:disabled{opacity:0.35;cursor:not-allowed;}

/* ── STATS ── */
.stats{padding:10px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sc{background:var(--surface);border-radius:10px;padding:8px 10px;text-align:center;}
.sv{font-family:'DM Serif Display',serif;font-size:17px;line-height:1;}
.sl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;margin-top:3px;}

/* ── STATUS ── */
.sbar{padding:8px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.smsg{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:7px;}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;transition:background 0.3s;}
.sdot.spin{background:var(--accent);animation:blink 0.9s infinite;}
.sdot.ok{background:var(--green);}
.sdot.err{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.25}}

/* ── PROGRESS BAR ── */
.progress-wrap{height:3px;background:var(--surface);flex-shrink:0;}
.progress-bar{height:3px;background:var(--accent);width:0%;transition:width 0.4s ease;border-radius:0 2px 2px 0;}

/* ── RESULTS HEADER ── */
.rhead{padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.rtitle{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.7px;color:var(--text3);}
.rcount{font-size:11px;color:var(--accent);font-weight:500;}

/* ── RESULTS LIST ── */
.rlist{flex:1;overflow-y:auto;padding:0 10px 10px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent;}

/* ── STOP GROUP ── */
.grp-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.7px;color:var(--accent);padding:10px 4px 6px;display:flex;align-items:center;gap:8px;}
.grp-hdr::after{content:'';flex:1;height:1px;background:var(--border2);}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 12px;margin-bottom:7px;cursor:pointer;transition:border-color 0.15s,background 0.15s;}
.card:hover{border-color:var(--border2);background:var(--surface2);}
.card.hl{border-color:var(--accent);}
.ct{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.cn{font-size:13px;font-weight:500;}
.cb{font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.4px;}
.cb.fuel{background:rgba(232,201,122,0.15);color:var(--accent);}
.cb.food{background:rgba(93,201,138,0.15);color:var(--green);}
.cb.rest{background:rgba(61,203,184,0.15);color:var(--teal);}
.ceta{font-size:11px;font-weight:600;color:var(--accent);margin-top:5px;}
.cd{margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;}
.cdi{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px;}
.cdi svg{width:10px;height:10px;}

/* ── MAP ── */
#map{flex:1;height:100vh;}
.leaflet-popup-content-wrapper{background:var(--surface) !important;color:var(--text) !important;border:1px solid var(--border2) !important;border-radius:var(--r) !important;box-shadow:0 8px 32px rgba(0,0,0,0.6) !important;padding:0 !important;}
.leaflet-popup-content{margin:0 !important;width:auto !important;}
.pi{padding:11px 13px;}
.pn{font-size:13px;font-weight:500;margin-bottom:3px;}
.pt{font-size:10px;color:var(--text3);}
.pe{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px;}
.leaflet-popup-tip{background:var(--surface) !important;}
.leaflet-popup-close-button{color:var(--text2) !important;top:6px !important;right:8px !important;}

@media(max-width:760px){
  body{flex-direction:column;}
  .sidebar{width:100%;min-width:unset;height:auto;max-height:58vh;}
  #map{height:42vh;}
}
</style>
</head>
<body>

<div class="sidebar">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
    </div>
    <div class="logo-text">
      <h1>MiRuta</h1>
      <span>Planificateur autoroutier</span>
    </div>
    <span class="version-badge">v1.5</span>
    <button class="collapse-btn open" id="btnCollapse">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      Masquer
    </button>
  </div>

  <!-- COLLAPSIBLE PANEL -->
  <div class="panel" id="panel">

    <!-- FORM -->
    <div class="form-section">
      <div class="iw">
        <svg class="ii" viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><circle cx="8" cy="8" r="3"/><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1a6 6 0 1 1 0 12A6 6 0 0 1 8 2z"/></svg>

        <input type="text" id="end" placeholder="Arrivée…" value="Barcelone"/>
      </div>

      <div class="grid2" style="margin-top:10px">
        <div class="stack">
          <span class="field-lbl">Départ à</span>
          <input type="time" id="depTime" value="08:00"/>
        </div>
        <div class="stack">
          <span class="field-lbl">Arrêt toutes les</span>
          <select id="interval">
            <option value="60">1 heure</option>
            <option value="90">1h30</option>
            <option value="120" selected>2 heures</option>
            <option value="150">2h30</option>
            <option value="180">3 heures</option>
          </select>
        </div>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="lunchSnap" checked/>
        Caler un arrêt déjeuner (12h–14h)

          Carburant
        </div>
        <div class="chip on" data-f="food">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.06 22.99h1.66c.84 0 1.53-.64 1.63-1.46L23 5.05h-5V1h-1.97v4.05h-4.97l.3 2.34c1.71.47 3.31 1.32 4.27 2.26 1.44 1.42 2.43 2.89 2.43 5.29v8.05zM1 21.99V21h15.03v.99c0 .55-.45 1-1.01 1H2.01c-.56 0-1.01-.45-1.01-1zm15.03-7c0-8.17-15.03-8.17-15.03 0h15.03zM1.02 17h15v2h-15z"/></svg>
          Restauration
        </div>
        <div class="chip on" data-f="rest">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg>

    <!-- BUTTONS -->
    <div class="btn-section">
      <div class="brow">

          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 3L3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"/></svg>
          Calculer l'itinéraire
        </button>
        <button class="btn btn-stops" id="btnStops" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>

<script>
const ORS = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZhMmQ3MGMxMDcxZTQ2MDk4MDNkOGQyYTE2ZGZhYTcyIiwiaCI6Im11cm11cjY0In0=";

// Overpass instances — browser sends proper Origin, they respond with ACAO:*
const OV = [
  "https://overpass-api.de/api/interpreter",
  "https://lz4.overpass-api.de/api/interpreter",
  "https://z.overpass-api.de/api/interpreter"
];

// ── MAP ────────────────────────────────────────
const map = L.map("map",{zoomControl:false}).setView([46.5,2.3],6);
L.control.zoom({position:"bottomright"}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  attribution:"© OpenStreetMap © CARTO",maxZoom:19
}).addTo(map);

// ── STATE ──────────────────────────────────────
let routeCoords=[], routeSec=0, routeLayer=null, markers=[];
let stops=[];
let filters=new Set(["fuel","food","rest"]);

// ── UI HELPERS ─────────────────────────────────
const $ = id => document.getElementById(id);

function status(msg, state="idle"){
  $("dot").className="sdot"+(state==="spin"?" spin":state==="ok"?" ok":state==="err"?" err":"");
  $("stxt").textContent=msg;
}

function progress(pct){
  $("pbar").style.width=pct+"%";
}

function fmtKm(m){ return (m/1000).toFixed(0)+" km"; }
function fmtH(s){
  const h=Math.floor(s/3600), m=Math.round((s%3600)/60);
  return h>0 ? h+"h"+String(m).padStart(2,"0") : m+"min";
}
function addMin(hhmm,min){
  const [h,m]=hhmm.split(":").map(Number);
  const t=h*60+m+min;
  return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// ── GEOCODE (Nominatim) ────────────────────────
async function geocode(q){
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
  const d=await r.json();
  if(!d.length) throw new Error("Lieu introuvable : "+q);
  return [parseFloat(d[0].lat),parseFloat(d[0].lon)];
}

// ── POI SEARCH (Overpass) ──────────────────────
// ONE tiny query per stop — all types combined, small radius, low limit
// ~130 bytes, typically returns in 1-2s
async function poiNear(lat,lon){
  const c=lat.toFixed(4)+","+lon.toFixed(4);
  const R=2500;
  const parts=[];
  if(filters.has("fuel"))  parts.push(`node(around:${R},${c})["amenity"="fuel"];`);
  if(filters.has("food"))  parts.push(
    `node(around:${R},${c})["amenity"="restaurant"];`,
    `node(around:${R},${c})["amenity"="fast_food"];`
  );
  if(filters.has("rest"))  parts.push(
    `node(around:${R},${c})["highway"="rest_area"];`,
    `node(around:${R},${c})["highway"="services"];`,
    `way(around:${R},${c})["highway"="services"];`
  );
  if(!parts.length) return [];

  const q=`[out:json][timeout:8];(\n${parts.join("\n")}\n);out center 20;`;

  for(const ep of OV){
    try{
      const ctrl=new AbortController();
      setTimeout(()=>ctrl.abort(),9000);
      const r=await fetch(ep,{method:"POST",body:q,signal:ctrl.signal});
      if(!r.ok) continue;
      const d=await r.json();
      if(d?.elements?.length>=0) return d.elements;
    }catch(e){console.warn("OV fallback",ep,e.message);}
  }
  return [];
}

// ── ICONS ──────────────────────────────────────
function makeIcon(type,num){
  const C={fuel:"#e8c97a",food:"#5dc98a",rest:"#3dcbb8"}[type]||"#9ba3b8";
  return L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="30" height="36" viewBox="0 0 30 36">
      <path d="M15 0C7.3 0 1 6.3 1 14c0 9.3 14 22 14 22S29 23.3 29 14C29 6.3 22.7 0 15 0z" fill="${C}" stroke="#0d0f14" stroke-width="1.5"/>
      <circle cx="15" cy="14" r="7.5" fill="#0d0f14"/>
      <text x="15" y="18.5" text-anchor="middle" font-size="9" font-family="DM Sans,Arial,sans-serif" fill="${C}" font-weight="700">${num}</text>
    </svg>`,
    iconSize:[30,36],iconAnchor:[15,36],popupAnchor:[0,-34],className:""
  });
}
function endIcon(col){
  return L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="9" fill="${col}" stroke="#0d0f14" stroke-width="2"/>
      <circle cx="10" cy="10" r="3.5" fill="#0d0f14"/>
    </svg>`,
    iconSize:[20,20],iconAnchor:[10,10],className:""
  });
}

// ── CLASSIFY ELEMENT ───────────────────────────
function classify(e){
  const am=e.tags?.amenity||"", hw=e.tags?.highway||"";
  if(am==="fuel")          return {type:"fuel",label:"Station-service"};
  if(am==="restaurant")    return {type:"food",label:"Restaurant"};
  if(am==="fast_food")     return {type:"food",label:"Restauration rapide"};
  if(hw==="rest_area")     return {type:"rest",label:"Aire de repos"};
  if(hw==="services")      return {type:"rest",label:"Aire de services"};
  return null;
}

// ── COORD AT FRACTION ──────────────────────────
function coordAt(f){
  const i=Math.min(Math.floor(f*routeCoords.length),routeCoords.length-1);
  return routeCoords[i];
}

// ── CALC ROUTE ─────────────────────────────────
async function calcRoute(){
  clearAll();
  progress(10);
  status("Géocodage…","spin");
  try{
    const [s,e]=await Promise.all([
      geocode($("start").value),
      geocode($("end").value)
    ]);
    progress(30);
    status("Calcul de l'itinéraire…","spin");
    const res=await fetch("https://api.openrouteservice.org/v2/directions/driving-car/geojson",{
      method:"POST",
      headers:{"Authorization":ORS,"Content-Type":"application/json"},
      body:JSON.stringify({coordinates:[[s[1],s[0]],[e[1],e[0]]]})
    });
    const data=await res.json();
    if(!data.features?.length) throw new Error("Aucun itinéraire trouvé");

    routeCoords=data.features[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    routeSec=data.features[0].properties.summary.duration;

    routeLayer=L.polyline(routeCoords,{color:"#e8c97a",weight:4,opacity:0.85}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});

    const ms=L.marker(s,{icon:endIcon("#4a9eff")}).addTo(map)
      .bindPopup(`<div class="pi"><div class="pn">${$("start").value}</div><div class="pt">Départ</div></div>`);
    const me=L.marker(e,{icon:endIcon("#ff6b6b")}).addTo(map)
      .bindPopup(`<div class="pi"><div class="pn">${$("end").value}</div><div class="pt">Arrivée</div></div>`);
    markers.push(ms,me);

    const sum=data.features[0].properties.summary;
    $("sDist").textContent=fmtKm(sum.distance);
    $("sDur").textContent=fmtH(sum.duration);
    $("sStops").textContent="0";
    $("btnStops").disabled=false;
    progress(100);
    status("Itinéraire calculé — cliquez sur « Trouver les arrêts »","ok");
    setTimeout(()=>progress(0),800);
  }catch(err){
    status("Erreur : "+err.message,"err");
    progress(0);
    console.error(err);
  }
}

// ── FIND STOPS ─────────────────────────────────
async function findStops(){
  if(!routeCoords.length){status("Calculez d'abord un itinéraire","err");return;}

  // Clear previous stop markers
  markers.slice(2).forEach(m=>map.removeLayer(m));
  markers=markers.slice(0,2);
  stops=[];
  $("rlist").innerHTML="";
  $("rhead").style.display="none";
  $("sStops").textContent="0";

  const dep=$("depTime").value||"08:00";
  const iv=parseInt($("interval").value)||120;
  const lunch=$("lunchSnap").checked;
  const totalMin=Math.round(routeSec/60);

  // Build stop times
  const times=[];
  for(let t=iv;t<totalMin-10;t+=iv) times.push(t);

  // Lunch snap
  if(lunch){
    const [dh,dm]=dep.split(":").map(Number);
    const depMin=dh*60+dm;
    const w12=12*60-depMin, w14=14*60-depMin;
    if(!times.some(t=>t>=w12&&t<=w14)&&w12>10&&w12<totalMin-10){
      times.push(Math.min(w14,Math.max(w12,w12+30)));
      times.sort((a,b)=>a-b);
    }
  }

  if(!times.length){status("Trajet trop court pour planifier des arrêts","err");return;}

  $("btnStops").disabled=true;
  $("btnRoute").disabled=true;

  for(let i=0;i<times.length;i++){
    const t=times[i];
    const frac=Math.min(t/totalMin,0.97);
    const coord=coordAt(frac);
    const eta=addMin(dep,t);
    const [dh,dm]=dep.split(":").map(Number);
    const absH=((dh*60+dm+t)%1440)/60;
    const isLunch=absH>=12&&absH<=14;

    progress(Math.round(((i+0.5)/times.length)*100));
    status(`Arrêt ${i+1}/${times.length} · ETA ${eta} — recherche…`,"spin");

    const elements=await poiNear(coord[0],coord[1]);

    // Pick best POI per type
    const byType={};
    for(const e of elements){
      const lat=e.lat??(e.center?.lat);
      const lon=e.lon??(e.center?.lon);
      if(!lat||!lon) continue;
      const cls=classify(e);
      if(!cls||!filters.has(cls.type)) continue;
      const name=e.tags?.name||e.tags?.brand||cls.label;
      const brand=e.tags?.brand||"";
      const dist=Math.hypot(lat-coord[0],lon-coord[1])*111000;
      const poi={lat,lon,name,brand,dist:Math.round(dist),...cls};
      if(!byType[cls.type]||dist<byType[cls.type].dist) byType[cls.type]=poi;
    }

    stops.push({t,coord,eta,isLunch,byType});

    // Render this stop immediately so user sees progress
    renderStop(i,stops[i]);
    $("sStops").textContent=i+1;

    // Show results header on first result
    if(i===0){
      $("rhead").style.display="flex";
    }
    $("rcnt").textContent=`${i+1} arrêt${i>0?"s":""}`;

    // Wait between queries to respect rate limit
    if(i<times.length-1) await sleep(1000);
  }

  progress(100);
  status(`✓ ${times.length} arrêt${times.length>1?"s":""} planifié${times.length>1?"s":""}`, "ok");
  setTimeout(()=>progress(0),1000);
  $("btnStops").disabled=false;
  $("btnRoute").disabled=false;
}

// ── RENDER ONE STOP ────────────────────────────
function renderStop(idx,stop){
  const list=$("rlist");

  // Group header
  const gh=document.createElement("div");
  gh.className="grp-hdr";
  gh.textContent=`Arrêt ${idx+1} · ${stop.eta}${stop.isLunch?" 🍽":""}`;
  list.appendChild(gh);

  const pois=Object.values(stop.byType);

  if(!pois.length){
    const empty=document.createElement("div");
    empty.className="card"; empty.style.opacity="0.45";
    empty.innerHTML=`<div class="cn" style="font-size:12px">Aucun établissement trouvé à ce point</div>`;
    list.appendChild(empty);
    // Waypoint marker anyway
    const mk=L.marker(stop.coord,{icon:makeIcon("rest",idx+1)}).addTo(map)
      .bindPopup(`<div class="pi"><div class="pn">Point d'arrêt ${idx+1}</div><div class="pe">${stop.eta}</div></div>`);
    markers.push(mk);
    return;
  }

  // Map marker for first POI
  const main=pois[0];
  const mk=L.marker([main.lat,main.lon],{icon:makeIcon(main.type,idx+1)}).addTo(map)
    .bindPopup(`<div class="pi">
      <div class="pn">${main.name}</div>
      <div class="pt">${main.label}${main.brand&&main.brand!==main.name?" · "+main.brand:""}</div>
      <div class="pe">ETA ${stop.eta}</div>
    </div>`);
  markers.push(mk);

  pois.forEach(poi=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="ct">
        <div class="cn">${poi.name}</div>
        <div class="cb ${poi.type}">${poi.label}</div>
      </div>
      <div class="ceta">⏱ ${stop.eta}</div>
      <div class="cd">
        ${poi.brand&&poi.brand!==poi.name?`<div class="cdi"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v12H2z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>${poi.brand}</div>`:""}
        <div class="cdi">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
          ${poi.dist} m de l'axe
        </div>
      </div>`;
    card.addEventListener("click",()=>{
      map.setView([poi.lat,poi.lon],15,{animate:true});
      mk.openPopup();
      document.querySelectorAll(".card").forEach(c=>c.classList.remove("hl"));
      card.classList.add("hl");
    });
    list.appendChild(card);
  });
}

// ── CLEAR ──────────────────────────────────────
function clearAll(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;}
  routeCoords=[];routeSec=0;stops=[];
  $("sDist").textContent=$("sDur").textContent="—";
  $("sStops").textContent="0";
  $("rlist").innerHTML="";
  $("rhead").style.display="none";
  $("btnStops").disabled=true;
  $("btnRoute").disabled=false;
  progress(0);
  status("Entrez un itinéraire pour commencer","idle");
}

// ── COLLAPSE ───────────────────────────────────
const panel=$("panel"), btn=$("btnCollapse");
let open=true;
btn.addEventListener("click",()=>{
  open=!open;
  panel.classList.toggle("closed",!open);
  btn.classList.toggle("open",open);
  btn.innerHTML=open
    ?`<svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg> Masquer`
    :`<svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg> Afficher`;
  setTimeout(()=>map.invalidateSize(),380);
});

// ── FILTER CHIPS ───────────────────────────────
document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{
    const f=c.dataset.f;
    if(filters.has(f)){filters.delete(f);c.classList.remove("on");}
    else{filters.add(f);c.classList.add("on");}
  });
});
$("btnReset").addEventListener("click",()=>{
  filters=new Set(["fuel","food","rest"]);
  document.querySelectorAll(".chip").forEach(c=>c.classList.add("on"));
});

// ── EVENTS ─────────────────────────────────────
$("btnRoute").addEventListener("click",calcRoute);
$("btnStops").addEventListener("click",findStops);
$("btnClear").addEventListener("click",clearAll);
</script>
</body>
</html>
