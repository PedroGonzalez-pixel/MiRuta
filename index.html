<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>MiRuta v1.4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0d0f14;--bg2:#13161d;--surface:#1f2330;--surface2:#252a38;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#f0f0ee;--text2:#9ba3b8;--text3:#606880;
  --accent:#e8c97a;--accent2:#c9a843;
  --blue:#4a9eff;--red:#ff6b6b;--green:#5dc98a;--teal:#3dcbb8;
  --radius:12px;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sidebar{width:390px;min-width:390px;height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}

.sidebar-header{padding:20px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.logo-icon svg{width:18px;height:18px;fill:var(--bg);}
.logo h1{font-family:'DM Serif Display',serif;font-size:19px;color:var(--text);}
.logo span{font-size:10px;font-weight:300;color:var(--text2);display:block;margin-top:-2px;}

.field-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);margin-bottom:5px;display:block;}
.input-wrap{position:relative;margin-bottom:8px;}
.input-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;}
input[type=text],input[type=time],select{
  width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);
  color:var(--text);padding:10px 10px 10px 34px;font-size:13px;font-family:'DM Sans',sans-serif;
  outline:none;transition:border-color 0.2s;
}
input[type=time],select{padding-left:10px;}
input:focus,select:focus{border-color:var(--accent);}
input::placeholder{color:var(--text3);}
select option{background:var(--surface2);}
.route-divider{height:8px;margin:0 0 8px 17px;display:flex;align-items:center;}
.route-divider::before{content:'';width:1px;height:100%;background:var(--border2);}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.row2 .input-wrap{margin-bottom:0;}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.btn{border:none;cursor:pointer;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all 0.18s;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-primary{background:var(--accent);color:#0d0f14;grid-column:1/-1;}
.btn-primary:hover{background:var(--accent2);}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border2);}
.btn-secondary:hover{background:var(--surface2);}
.btn-danger{background:transparent;color:var(--text2);border:1px solid var(--border);}
.btn-danger:hover{color:var(--red);border-color:var(--red);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* ── PLANNING OPTIONS ── */
.plan-section{padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.plan-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.plan-group{display:flex;flex-direction:column;gap:5px;}

/* ── FILTERS ── */
.filter-section{padding:12px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text2);transition:all 0.15s;display:flex;align-items:center;gap:4px;user-select:none;}
.chip.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}
.chip svg{width:11px;height:11px;}

/* ── STATS ── */
.stats-bar{padding:12px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;}
.stat-card{background:var(--surface);border-radius:10px;padding:9px 10px;text-align:center;}
.stat-val{font-family:'DM Serif Display',serif;font-size:18px;color:var(--text);line-height:1;}
.stat-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-top:3px;}

/* ── STATUS ── */
.status-bar{padding:8px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.status-msg{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:7px;}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.status-dot.loading{background:var(--accent);animation:pulse 1s infinite;}
.status-dot.ok{background:var(--green);}
.status-dot.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── RESULTS ── */
.results-header{padding:10px 20px 6px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.results-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);}
.results-count{font-size:11px;color:var(--accent);font-weight:500;}
.results-list{flex:1;overflow-y:auto;padding:0 12px 12px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--surface2) transparent;}

/* ── STOP CARDS ── */
.stop-group-header{
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;
  color:var(--accent);padding:10px 4px 6px;display:flex;align-items:center;gap:8px;
}
.stop-group-header::after{content:'';flex:1;height:1px;background:var(--border2);}

.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:all 0.15s;}
.result-card:hover{border-color:var(--border2);background:var(--surface2);}
.result-card.highlighted{border-color:var(--accent);}
.rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.rc-name{font-size:13px;font-weight:500;color:var(--text);}
.rc-badge{font-size:9px;font-weight:600;padding:3px 7px;border-radius:5px;flex-shrink:0;text-transform:uppercase;letter-spacing:0.5px;}
.badge-fuel{background:rgba(232,201,122,0.15);color:var(--accent);}
.badge-food{background:rgba(93,201,138,0.15);color:var(--green);}
.badge-rest{background:rgba(61,203,184,0.15);color:var(--teal);}
.rc-details{margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;}
.rc-detail{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px;}
.rc-detail svg{width:10px;height:10px;flex-shrink:0;}
.rc-time{font-size:11px;font-weight:600;color:var(--accent);margin-top:5px;}

/* ── MAP ── */
#map{flex:1;height:100vh;}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius) !important;box-shadow:0 8px 30px rgba(0,0,0,0.5) !important;padding:0 !important;}
.leaflet-popup-content{margin:0 !important;width:auto !important;}
.popup-inner{padding:11px 13px;}
.popup-name{font-size:13px;font-weight:500;margin-bottom:3px;}
.popup-type{font-size:10px;color:var(--text3);}
.popup-eta{font-size:11px;color:var(--accent);font-weight:600;margin-top:4px;}
.leaflet-popup-tip{background:var(--surface) !important;}
.leaflet-popup-close-button{color:var(--text2) !important;top:6px !important;right:8px !important;}

/* ── COLLAPSIBLE PANEL ── */
.panel-body{overflow:hidden;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.3s;max-height:600px;opacity:1;}
.panel-body.collapsed{max-height:0;opacity:0;pointer-events:none;}
.collapse-btn{background:none;border:none;cursor:pointer;padding:0;color:var(--text3);line-height:1;transition:color 0.15s,transform 0.3s;display:flex;align-items:center;}
.collapse-btn:hover{color:var(--accent);}
.collapse-btn.collapsed svg{transform:rotate(-90deg);}
.collapse-btn svg{transition:transform 0.3s;width:16px;height:16px;}

@media(max-width:800px){
  body{flex-direction:column;}
  .sidebar{width:100%;min-width:unset;height:auto;max-height:60vh;}
  #map{height:40vh;}
}
</style>
</head>

<script>
const ORS_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZhMmQ3MGMxMDcxZTQ2MDk4MDNkOGQyYTE2ZGZhYTcyIiwiaCI6Im11cm11cjY0In0=";

// ── MAP ──────────────────────────────────────────────
const map = L.map("map",{zoomControl:false}).setView([46.5,2.3],6);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  attribution:"&copy; OpenStreetMap &copy; CARTO", maxZoom:19
}).addTo(map);

// ── STATE ────────────────────────────────────────────
let routeCoords=[], routeDurationSec=0, routeLayer=null, markers=[];
let activeFilters = new Set(["fuel","food","rest"]);
let allStops=[];

// ── HELPERS ──────────────────────────────────────────
function setStatus(msg,state="idle"){
  document.getElementById("statusDot").className="status-dot "+(state==="loading"?"loading":state==="ok"?"ok":state==="error"?"error":"");
  document.getElementById("statusText").textContent=msg;
}
function fmtDist(m){return m>=1000?(m/1000).toFixed(0)+" km":Math.round(m)+" m";}
function fmtTime(s){const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h>0?h+"h "+String(m).padStart(2,"0"):m+"min";}
function addMinutes(hhmm,mins){
  const [h,m]=hhmm.split(":").map(Number);
  const total=h*60+m+mins;
  return String(Math.floor(total/60)%24).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
}

async function geocode(q){
  const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,
    {headers:{"Accept-Language":"fr"}});
  const d=await r.json();
  if(!d.length) throw new Error("Lieu introuvable : "+q);
  return [parseFloat(d[0].lat),parseFloat(d[0].lon)];
}

const OVERPASS_URLS=[
  "https://overpass.private.coffee/api/interpreter",
  "https://lz4.overpass-api.de/api/interpreter",
  "https://overpass.openstreetmap.ru/api/interpreter"
];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

// Single Overpass query per stop — all types in one round-trip
async function searchStopPOIs(lat,lon,filters){
  const R=3000;
  const c=lat.toFixed(5)+","+lon.toFixed(5);
  const parts=[];
  if(filters.has("fuel"))  parts.push(`node(around:${R},${c})["amenity"="fuel"];`);
  if(filters.has("food"))  parts.push(
    `node(around:${R},${c})["amenity"="restaurant"];`,
    `node(around:${R},${c})["amenity"="fast_food"];`,
    `node(around:${R},${c})["amenity"="cafe"];`
  );
  if(filters.has("rest"))  parts.push(
    `node(around:${R},${c})["highway"="rest_area"];`,
    `node(around:${R},${c})["highway"="services"];`,
    `way(around:${R},${c})["highway"="services"];`
  );
  if(!parts.length) return [];
  const q="[out:json][timeout:12];(\n"+parts.join("\n")+"\n);out center 30;";
  for(const ep of OVERPASS_URLS){
    try{
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),11000);
      const r=await fetch(ep,{method:"POST",body:q,signal:ctrl.signal});
      clearTimeout(tid);
      if(!r.ok) throw new Error("HTTP "+r.status);
      const d=await r.json();
      if(d?.elements) return d.elements;
    }catch(e){console.warn("Overpass",ep,e.message);}
  }
  return [];
}

// Get coord at a given fraction along the route polyline
function coordAtFraction(frac){
  const idx=Math.min(Math.floor(frac*routeCoords.length), routeCoords.length-1);
  return routeCoords[idx];
}

// ── ICONS ────────────────────────────────────────────
function makeIcon(type,idx){
  const colors={fuel:"#e8c97a",food:"#5dc98a",rest:"#3dcbb8"};
  const c=colors[type]||"#9ba3b8";
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="30" height="37" viewBox="0 0 30 37">
    <path d="M15 0C7.27 0 1 6.27 1 14c0 9.33 14 23 14 23S29 23.33 29 14C29 6.27 22.73 0 15 0z" fill="${c}" stroke="#0d0f14" stroke-width="1.5"/>
    <circle cx="15" cy="14" r="7" fill="#0d0f14"/>
    <text x="15" y="18" text-anchor="middle" font-size="9" font-family="DM Sans,Arial" fill="${c}" font-weight="700">${idx}</text>
  </svg>`;
  return L.divIcon({html:svg,iconSize:[30,37],iconAnchor:[15,37],popupAnchor:[0,-34],className:""});
}
function makeEndIcon(color){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
    <circle cx="11" cy="11" r="10" fill="${color}" stroke="#0d0f14" stroke-width="2"/>
    <circle cx="11" cy="11" r="4" fill="#0d0f14"/>
  </svg>`;
  return L.divIcon({html:svg,iconSize:[22,22],iconAnchor:[11,11],className:""});
}

// ── CALC ROUTE ───────────────────────────────────────
async function calcRoute(){
  clearAll();
  setStatus("Géocodage…","loading");
  try{
    const [s,e]=await Promise.all([
      geocode(document.getElementById("start").value),
      geocode(document.getElementById("end").value)
    ]);
    setStatus("Calcul de l'itinéraire…","loading");
    const res=await fetch("https://api.openrouteservice.org/v2/directions/driving-car/geojson",{
      method:"POST",
      headers:{"Authorization":ORS_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({coordinates:[[s[1],s[0]],[e[1],e[0]]]})
    });
    const data=await res.json();
    if(!data.features?.length) throw new Error("Aucun itinéraire trouvé");

    routeCoords=data.features[0].geometry.coordinates.map(c=>[c[1],c[0]]);
    routeDurationSec=data.features[0].properties.summary.duration;
    routeLayer=L.polyline(routeCoords,{color:"#e8c97a",weight:4,opacity:0.85}).addTo(map);
    map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});

    const sm=L.marker(s,{icon:makeEndIcon("#4a9eff")}).addTo(map)
      .bindPopup(`<div class="popup-inner"><div class="popup-name">${document.getElementById("start").value}</div><div class="popup-type">Départ</div></div>`);
    const em=L.marker(e,{icon:makeEndIcon("#ff6b6b")}).addTo(map)
      .bindPopup(`<div class="popup-inner"><div class="popup-name">${document.getElementById("end").value}</div><div class="popup-type">Arrivée</div></div>`);
    markers.push(sm,em);

    const sum=data.features[0].properties.summary;
    document.getElementById("distance").textContent=fmtDist(sum.distance);
    document.getElementById("duration").textContent=fmtTime(sum.duration);
    document.getElementById("stopsCount").textContent="0";
    document.getElementById("btnStops").disabled=false;
    setStatus("Itinéraire calculé — cliquez sur « Planifier les arrêts »","ok");
  }catch(e){
    setStatus("Erreur : "+e.message,"error");
    console.error(e);
  }
}

// ── PLAN STOPS ───────────────────────────────────────
async function planStops(){
  if(!routeCoords.length){setStatus("Tracez d'abord un itinéraire","error");return;}

  markers.slice(2).forEach(m=>map.removeLayer(m));
  markers=markers.slice(0,2);
  allStops=[];
  document.getElementById("resultsList").innerHTML="";
  document.getElementById("resultsHeader").style.display="none";

  const departTime=document.getElementById("departTime").value||"08:00";
  const intervalMin=parseInt(document.getElementById("stopInterval").value)||120;
  const lunchSnap=document.getElementById("lunchSnap").checked;
  const totalMin=Math.round(routeDurationSec/60);

  // Build stop times (minutes from departure)
  const stopTimes=[];
  const iv=intervalMin>0?intervalMin:120;
  for(let t=iv;t<totalMin-15;t+=iv) stopTimes.push(t);

  // Lunch snap: insert a stop if nothing falls between 12h and 14h
  if(lunchSnap){
    const [dh,dm]=departTime.split(":").map(Number);
    const depMin=dh*60+dm;
    const w12=12*60-depMin, w14=14*60-depMin;
    const hasLunch=stopTimes.some(t=>t>=w12&&t<=w14);
    if(!hasLunch&&w12>15&&w12<totalMin-15){
      stopTimes.push(Math.min(w14,w12+30));
      stopTimes.sort((a,b)=>a-b);
    }
  }

  if(!stopTimes.length){
    setStatus("Trajet trop court pour des arrêts","error");return;
  }

  document.getElementById("btnStops").disabled=true;
  const stopData=[];

  for(let i=0;i<stopTimes.length;i++){
    const t=stopTimes[i];
    const frac=Math.min(t/totalMin,0.98);
    const coord=coordAtFraction(frac);
    const eta=addMinutes(departTime,t);
    const [dh,dm]=departTime.split(":").map(Number);
    const absH=((dh*60+dm+t)%(1440))/60;
    const isLunch=absH>=12&&absH<=14;

    setStatus(`Arrêt ${i+1}/${stopTimes.length} — recherche à ${eta}…`,"loading");

    const elements=await searchStopPOIs(coord[0],coord[1],activeFilters);
    await sleep(600); // respect rate limit between stops

    // Classify elements and pick best per type
    const byType={};
    for(const e of elements){
      const lat=e.lat??(e.center?.lat);
      const lon=e.lon??(e.center?.lon);
      if(!lat||!lon) continue;
      const am=e.tags?.amenity||"";
      const hw=e.tags?.highway||"";
      let type=null,label="";
      if(am==="fuel"&&activeFilters.has("fuel"))             {type="fuel";label="Station-service";}
      else if(["restaurant","fast_food","cafe"].includes(am)&&activeFilters.has("food")){
        type="food";
        label=am==="fast_food"?"Restauration rapide":am==="cafe"?"Café":"Restaurant";
      }
      else if(["rest_area","services"].includes(hw)&&activeFilters.has("rest")){
        type="rest";label="Aire "+(hw==="services"?"de services":"de repos");
      }
      if(!type) continue;
      const name=e.tags?.name||(e.tags?.brand)||label;
      const brand=e.tags?.brand||"";
      const dist=Math.sqrt((lat-coord[0])**2+(lon-coord[1])**2)*111000;
      const poi={lat,lon,name,brand,label,type,distM:Math.round(dist)};
      if(!byType[type]||dist<byType[type].distM) byType[type]=poi;
    }

    stopData.push({t,coord,eta,isLunch,byType});
  }

  document.getElementById("btnStops").disabled=false;
  allStops=stopData;
  renderStops();
  document.getElementById("stopsCount").textContent=stopTimes.length;
  setStatus(`${stopTimes.length} arrêt${stopTimes.length>1?"s":""} planifié${stopTimes.length>1?"s":""}  ✓`,"ok");
}

// ── RENDER STOPS ─────────────────────────────────────
function renderStops(){
  markers.slice(2).forEach(m=>map.removeLayer(m));
  markers=markers.slice(0,2);

  const list=document.getElementById("resultsList");
  list.innerHTML="";
  const header=document.getElementById("resultsHeader");
  if(!allStops.length){header.style.display="none";return;}
  header.style.display="flex";
  document.getElementById("resultsCount").textContent=allStops.length+" arrêt"+(allStops.length>1?"s":"");

  allStops.forEach((stop,idx)=>{
    // ── Group header
    const gh=document.createElement("div");
    gh.className="stop-group-header";
    gh.textContent="Arrêt "+(idx+1)+" · "+stop.eta+(stop.isLunch?" 🍽 Déjeuner":"");
    list.appendChild(gh);

    const pois=Object.values(stop.byType);

    if(!pois.length){
      const empty=document.createElement("div");
      empty.className="result-card"; empty.style.opacity="0.5";
      empty.innerHTML='<div class="rc-name">Aucun établissement trouvé ici</div>';
      list.appendChild(empty);
      const mk=L.marker(stop.coord,{icon:makeIcon("rest",idx+1)}).addTo(map)
        .bindPopup(`<div class="popup-inner"><div class="popup-name">Point d'arrêt ${idx+1}</div><div class="popup-eta">ETA : ${stop.eta}</div></div>`);
      markers.push(mk);
      return;
    }

    // Place one map marker per stop (first POI)
    const main=pois[0];
    const mk=L.marker([main.lat,main.lon],{icon:makeIcon(main.type,idx+1)}).addTo(map)
      .bindPopup(`<div class="popup-inner">
        <div class="popup-name">${main.name}</div>
        <div class="popup-type">${main.label}${main.brand&&main.brand!==main.name?" · "+main.brand:""}</div>
        <div class="popup-eta">ETA : ${stop.eta}</div>
      </div>`);
    markers.push(mk);

    // One card per POI type found
    pois.forEach(poi=>{
      const card=document.createElement("div");
      card.className="result-card";
      card.innerHTML=`
        <div class="rc-top">
          <div class="rc-name">${poi.name}</div>
          <div class="rc-badge badge-${poi.type}">${poi.label}</div>
        </div>
        <div class="rc-time">⏱ ${stop.eta}</div>
        <div class="rc-details">
          ${poi.brand&&poi.brand!==poi.name?`<div class="rc-detail"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1" fill="none"/><text x="8" y="12" text-anchor="middle" font-size="9" fill="currentColor">B</text></svg>${poi.brand}</div>`:""}
          <div class="rc-detail">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
            ${poi.distM} m de l'axe
          </div>
        </div>`;
      card.addEventListener("click",()=>{
        map.setView([poi.lat,poi.lon],15,{animate:true});
        mk.openPopup();
        document.querySelectorAll(".result-card").forEach(c=>c.classList.remove("highlighted"));
        card.classList.add("highlighted");
      });
      list.appendChild(card);
    });
  });
}

// ── CLEAR ────────────────────────────────────────────
function clearAll(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  if(routeLayer){map.removeLayer(routeLayer);routeLayer=null;}
  routeCoords=[];routeDurationSec=0;allStops=[];
  document.getElementById("distance").textContent="—";
  document.getElementById("duration").textContent="—";
  document.getElementById("stopsCount").textContent="0";
  document.getElementById("resultsList").innerHTML="";
  document.getElementById("resultsHeader").style.display="none";
  document.getElementById("btnStops").disabled=true;
  setStatus("Entrez un itinéraire pour commencer","idle");
}

// ── FILTERS ──────────────────────────────────────────
document.querySelectorAll(".chip").forEach(chip=>{
  chip.addEventListener("click",()=>{
    const f=chip.dataset.filter;
    if(activeFilters.has(f)){activeFilters.delete(f);chip.classList.remove("active");}
    else{activeFilters.add(f);chip.classList.add("active");}
  });
});

document.getElementById("btnRoute").addEventListener("click",calcRoute);
document.getElementById("btnStops").addEventListener("click",planStops);
document.getElementById("btnClear").addEventListener("click",clearAll);

// ── COLLAPSE PANEL ────────────────────────────────────
const btnCollapse=document.getElementById("btnCollapse");
const panelBody=document.getElementById("panelBody");
let panelOpen=true;
btnCollapse.addEventListener("click",()=>{
  panelOpen=!panelOpen;
  panelBody.classList.toggle("collapsed",!panelOpen);
  btnCollapse.classList.toggle("collapsed",!panelOpen);
  // Trigger map resize after transition
  setTimeout(()=>map.invalidateSize(),360);
});

// ── RESET FILTERS ─────────────────────────────────────
document.getElementById("btnResetFilters").addEventListener("click",()=>{
  activeFilters=new Set(["fuel","food","rest"]);
  document.querySelectorAll(".chip").forEach(c=>{
    c.classList.add("active");
  });
});
</script>
