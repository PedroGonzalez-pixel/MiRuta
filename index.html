<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>MiRuta Pro v5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="icon" href="data:,">

<style>
body { margin:0; font-family: Arial; background:#f5f7fb; }
.sidebar {
  width:320px;
  height:100vh;
  float:left;
  padding:15px;
  background:white;
  border-right:1px solid #ddd;
}
#map {
  margin-left:320px;
  height:100vh;
}
input, button, select {
  width:100%;
  margin-bottom:8px;
  padding:8px;
}
button {
  background:#007bff;
  color:white;
  border:none;
  cursor:pointer;
}
.card {
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
  background:#fafafa;
}
.stat {
  display:flex;
  justify-content:space-between;
  font-size:14px;
}
</style>
</head>

<body>

<div class="sidebar">

<h2>MiRuta Pro</h2>

<input id="start" value="Paris">
<input id="end" value="Barcelone">

<button onclick="route()">Tracer itinéraire</button>
<button onclick="findStops()">Stations</button>

<div class="card">
<b>Résumé</b>
<div class="stat">Distance <span id="distance">-</span></div>
<div class="stat">Temps <span id="duration">-</span></div>
</div>

<p id="info">Prêt</p>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ✅ API
const API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZhMmQ3MGMxMDcxZTQ2MDk4MDNkOGQyYTE2ZGZhYTcyIiwiaCI6Im11cm11cjY0In0=";

const OVERPASS = [
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass-api.de/api/interpreter"
];

let map = L.map('map').setView([48.85,2.35],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let routeCoords = [];
let routeLayer;
let markers = [];

// =========================
// GEO
// =========================
async function geocode(place){
 let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place}`);
 let data = await res.json();
 return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
}

// =========================
// FORMAT
// =========================
function formatDistance(m){ return (m/1000).toFixed(1)+" km"; }
function formatTime(s){
 let h = Math.floor(s/3600);
 let m = Math.round((s%3600)/60);
 return h+"h "+m+"m";
}

// =========================
// ROUTE
// =========================
async function route(){

 document.getElementById("info").innerHTML = "Calcul en cours...";

 let start = await geocode(document.getElementById("start").value);
 let end = await geocode(document.getElementById("end").value);

 let res = await fetch("https://api.openrouteservice.org/v2/directions/driving-car/geojson",{
  method:"POST",
  headers:{
    "Authorization":API_KEY,
    "Content-Type":"application/json"
  },
  body:JSON.stringify({
    coordinates:[[start[1],start[0]],[end[1],end[0]]]
  })
 });

 let data = await res.json();

 routeCoords = data.features[0].geometry.coordinates.map(c=>[c[1],c[0]]);

 if(routeLayer) map.removeLayer(routeLayer);

 routeLayer = L.polyline(routeCoords,{color:"blue"}).addTo(map);
 map.fitBounds(routeLayer.getBounds());

 document.getElementById("distance").innerHTML =
   formatDistance(data.features[0].properties.summary.distance);

 document.getElementById("duration").innerHTML =
   formatTime(data.features[0].properties.summary.duration);

 document.getElementById("info").innerHTML = "✅ Itinéraire OK";
}

// =========================
// DISTANCE
// =========================
function distanceToRoute(p){
 let min=999999;
 routeCoords.forEach(r=>{
  let d = Math.sqrt((p[0]-r[0])**2+(p[1]-r[1])**2);
  if(d<min) min=d;
 });
 return min;
}

// =========================
// STATIONS (FIABLE)
// =========================
async function findStops(){

 markers.forEach(m=>map.removeLayer(m));
 markers = [];

 if(routeCoords.length === 0){
   alert("Trace un itinéraire d'abord");
   return;
 }

 document.getElementById("info").innerHTML = "Recherche stations...";

 let points = routeCoords.filter((_,i)=>i%80===0);

 let data=null;

 for(let url of OVERPASS){
   try{
     let query = `
     [out:json][timeout:10];
     (
       ${points.map(p=>`node(around:1000,${p[0]},${p[1]})["amenity"="fuel"];`).join("")}
     );
     out;
     `;

     let res = await fetch(url,{method:"POST",body:query});
     data = await res.json();
     break;
   } catch(e){
     console.log("fallback",url);
   }
 }

 if(!data){
   document.getElementById("info").innerHTML = "⚠️ API indisponible";
   return;
 }

 let list=[];

 data.elements.forEach(e=>{
   let d = distanceToRoute([e.lat,e.lon]);
   list.push({e,d});
 });

 list.sort((a,b)=>a.d-b.d);

 list.slice(0,8).forEach(item=>{
   let m = L.marker([item.e.lat,item.e.lon])
     .addTo(map)
     .bindPopup("⛽ "+(item.e.tags?.name || "Station"));
   markers.push(m);
 });

 if(markers.length>0){
   let group = new L.featureGroup(markers);
   map.fitBounds(group.getBounds());
 }

 document.getElementById("info").innerHTML = "✅ Stations affichées";
}

</script>

</body>
</html>
